# AHP 指标体系（v5 · 模板 16 项基线，结构支持扩到 20）
#
# schema 只随字段结构破坏性变更升；version 随内容升（当前 version=5）。
# schema/version 是标准资产版本：改本文件任一指标定义/方向/锚点 = 改标准
#   → version + 1 + 跑 T4/T9/T10 回归 + 差异清单进交接。
# pendingConfirm 标记（可逆口径门，未获用户答复时按默认继续）：
#   G-ahp-1 指标集合 = 模板 16 项（不是任务书的 15–20 项全集）
#   G-ahp-4 10 分制锚点为通用草案，待用户确认后固化（改锚点 = 升版本）
schema: cardo/ahp-indicators/v1
version: 5
status: pendingConfirm
quantificationNote: 16 项取数与数值分档见同目录 指标量化分档.yaml（schema cardo/ahp-indicators-quant/v1）
changeLog:
  - version: 5
    reason: v2-v4 变更见 docs/handoff/T2 交接；当前结构 = 16 项 + 阶跃赋分 + quantization 拆分
pendingConfirm:
  - G-ahp-1
  - G-ahp-4
sourceTemplate: 数据/标准模板/4 层次分析法AHP四准则模板.xlsx（只读，sheet=层次分析模板，A1:R97；2026-10-23 前位于工作根）
sourceTaskbook: ../提资数据/课题资料/20_课题任务书_低空技术_片区城市更新投资决策.docx §2.2.2 / §4.2.2（只读；2026-10-28 起统一存放于根目录 提资数据/课题资料）
namingNote: 任务书准则层用「现状适配性/投资经济性/规划合规性/风险可控性」，模板与建议书用短名；id 用模板短名的英文，displayName 同时保留两种写法。
goal:
  id: goal
  name: 片区城市更新改造投资决策最优方案
criteria:
  - id: current
    name: 现状情况
    displayName:
      template: 现状情况
      taskbook: 现状适配性
    order: 1
    description: 片区现状条件（建筑与设施老化、安全、密度、容积率）对更新实施的适配程度。
  - id: economy
    name: 投资经济
    displayName:
      template: 投资经济
      taskbook: 投资经济性
    order: 2
    description: 改造投入与产出关系，含成本、收益、回收期与资产增值潜力。
  - id: compliance
    name: 规划合规
    displayName:
      template: 规划合规
      taskbook: 规划合规性
    order: 3
    description: 与城市规划、政策、基础设施配套、生态环保要求的符合程度。
  - id: risk
    name: 风险可控
    displayName:
      template: 风险可控
      taskbook: 风险可控性
    order: 4
    description: 政策、成本、社会稳定、工程延误等风险的可控程度。
namingMap:
  - criterionId: current
    template: 现状情况
    taskbook: 现状适配性
  - criterionId: economy
    template: 投资经济
    taskbook: 投资经济性
  - criterionId: compliance
    template: 规划合规
    taskbook: 规划合规性
  - criterionId: risk
    template: 风险可控
    taskbook: 风险可控性
  - note: 指标层 16 项名称任务书未逐项列出（只写 15-20 项），以模板与建议书为准；建议书第九章与模板同名。
indicators:
  - id: current.age
    criterionId: current
    name: 房屋设施老化程度
    definition: 片区房屋与配套设施的老化、破损、失修程度，越高越不利于更新实施。
    direction: smaller_better
    directionNote: 老化程度越低越好，故得分与老化程度反向。
    source: 现状分析
    templateCell: B37
    anchors:
      - score: 1
        desc: 普遍老旧失修，结构安全隐患突出
      - score: 3
        desc: 老化明显，局部设施失效
      - score: 5
        desc: 中度老化，主体结构基本可用
      - score: 7
        desc: 轻微老化，设施基本完好
      - score: 9
        desc: 建成较新，设施完好
  - id: current.safety
    criterionId: current
    name: 安全风险等级
    definition: 消防、结构、地质灾害等安全风险等级，等级越高越不利。
    direction: smaller_better
    directionNote: 风险等级越低得分越高。
    source: 现状分析
    templateCell: B38
    anchors:
      - score: 1
        desc: 重大安全隐患，需立即处置
      - score: 3
        desc: 较大风险，需专项整治
      - score: 5
        desc: 一般风险，可随改造消除
      - score: 7
        desc: 低风险，局部整改即可
      - score: 9
        desc: 无明显风险
  - id: current.density
    criterionId: current
    name: 现状建筑密度
    definition: 现状建筑基底面积占用地面积比例，过高会压缩公共空间与施工空间。
    direction: smaller_better
    directionNote: 密度越低，更新腾挪空间越大，得分越高。
    source: 现状分析
    templateCell: B39
    anchors:
      - score: 1
        desc: 密度极高，几无公共空间
      - score: 3
        desc: 密度偏高，公共空间不足
      - score: 5
        desc: 密度中等，可局部改善
      - score: 7
        desc: 密度较低，改善空间较大
      - score: 9
        desc: 密度低，空间充裕
  - id: current.far
    criterionId: current
    name: 现状容积率
    definition: 现状地上建筑面积与用地面积之比，反映开发强度与更新余量。
    direction: smaller_better
    directionNote: 现状容积率越低，新增容量与收益空间越大，得分越高。
    source: 现状分析
    templateCell: B40
    anchors:
      - score: 1
        desc: 容积率很高，几乎无增量空间
      - score: 3
        desc: 容积率偏高，增量有限
      - score: 5
        desc: 容积率中等，尚有余量
      - score: 7
        desc: 容积率较低，余量较大
      - score: 9
        desc: 容积率低，增量空间充足
  - id: economy.cost
    criterionId: economy
    name: 改造总成本
    definition: 项目改造总投资（含建安、配套、前期费用），越低越有利。
    direction: smaller_better
    directionNote: 成本越低得分越高（相对同类项目）。
    source: 财务测算
    templateCell: B45
    anchors:
      - score: 1
        desc: 投资显著高于同类项目
      - score: 3
        desc: 投资偏高
      - score: 5
        desc: 投资与同类相当
      - score: 7
        desc: 投资偏低
      - score: 9
        desc: 投资显著低于同类
  - id: economy.irr
    criterionId: economy
    name: 预期内部收益率
    definition: 项目税后财务内部收益率，越高越有利。
    direction: larger_better
    directionNote: IRR 越高得分越高。
    source: 财务测算
    templateCell: B46
    anchors:
      - score: 1
        desc: 低于基准收益率，财务不可行
      - score: 3
        desc: 接近基准收益率
      - score: 5
        desc: 略高于基准收益率
      - score: 7
        desc: 明显高于基准收益率
      - score: 9
        desc: 显著高于基准收益率
  - id: economy.payback
    criterionId: economy
    name: 投资回收期
    definition: 静态投资回收期（年），越短越有利。
    direction: smaller_better
    directionNote: 回收期越短得分越高。
    source: 财务测算
    templateCell: B47
    anchors:
      - score: 1
        desc: 回收期显著长于同类
      - score: 3
        desc: 回收期偏长
      - score: 5
        desc: 回收期与同类相当
      - score: 7
        desc: 回收期偏短
      - score: 9
        desc: 回收期显著短于同类
  - id: economy.appreciation
    criterionId: economy
    name: 资产增值潜力
    definition: 改造后区域与资产价值提升空间（租金、售价、业态升级）。
    direction: larger_better
    directionNote: 增值潜力越大得分越高。
    source: 专家判断
    templateCell: B48
    anchors:
      - score: 1
        desc: 无增值空间
      - score: 3
        desc: 增值空间小
      - score: 5
        desc: 增值空间中等
      - score: 7
        desc: 增值空间较大
      - score: 9
        desc: 增值空间很大
  - id: compliance.plan
    criterionId: compliance
    name: 城市规划符合度
    definition: 项目与国土空间规划、控规、专项规划的符合程度。
    direction: larger_better
    directionNote: 符合度越高得分越高。
    source: 现状分析
    templateCell: B53
    anchors:
      - score: 1
        desc: 与规划冲突
      - score: 3
        desc: 多处不符，需调整
      - score: 5
        desc: 基本符合，局部需论证
      - score: 7
        desc: 符合，少量优化
      - score: 9
        desc: 完全符合规划导向
  - id: compliance.policy
    criterionId: compliance
    name: 政策合规
    definition: 项目与城市更新、征收、补贴、审批等政策的符合与可适用程度。
    direction: larger_better
    directionNote: 政策符合与可适用性越高得分越高。
    source: 专家判断
    templateCell: B54
    anchors:
      - score: 1
        desc: 政策禁止或无法适用
      - score: 3
        desc: 多数条件不满足
      - score: 5
        desc: 基本满足，需补要件
      - score: 7
        desc: 满足主要条件
      - score: 9
        desc: 完全符合且可享政策支持
  - id: compliance.infra
    criterionId: compliance
    name: 基础设施配套率
    definition: 市政、交通、公共服务设施配套完善程度。
    direction: larger_better
    directionNote: 配套率越高得分越高。
    source: 现状分析
    templateCell: B55
    anchors:
      - score: 1
        desc: 配套严重缺失
      - score: 3
        desc: 配套不足较明显
      - score: 5
        desc: 配套一般
      - score: 7
        desc: 配套较完善
      - score: 9
        desc: 配套完善
  - id: compliance.eco
    criterionId: compliance
    name: 生态环保标准
    definition: 项目在能耗、排放、绿地、海绵等生态环保要求上的达标程度。
    direction: larger_better
    directionNote: 生态环保达标程度越高得分越高。
    source: 专家判断
    templateCell: B56
    anchors:
      - score: 1
        desc: 多项不达标
      - score: 3
        desc: 达标项少
      - score: 5
        desc: 基本达标
      - score: 7
        desc: 多数优于标准
      - score: 9
        desc: 全面优于标准
  - id: risk.policy
    criterionId: risk
    name: 政策风险
    definition: 政策调整、审批不确定、征收与补贴政策变化带来的风险。
    direction: smaller_better
    directionNote: 风险越低得分越高。
    source: 专家判断
    templateCell: B61
    anchors:
      - score: 1
        desc: 政策高度不确定，落地风险大
      - score: 3
        desc: 政策存在明显不确定性
      - score: 5
        desc: 政策基本稳定，有一般不确定性
      - score: 7
        desc: 政策较稳定
      - score: 9
        desc: 政策明确稳定
  - id: risk.cost_overrun
    criterionId: risk
    name: 成本超支风险
    definition: 造价上涨、变更、工期延长导致成本超支的风险。
    direction: smaller_better
    directionNote: 超支风险越低得分越高。
    source: 财务测算
    templateCell: B62
    anchors:
      - score: 1
        desc: 超支概率高、无缓冲
      - score: 3
        desc: 超支风险较明显
      - score: 5
        desc: 风险一般
      - score: 7
        desc: 风险较低
      - score: 9
        desc: 风险很低，有充足缓冲
  - id: risk.social
    criterionId: risk
    name: 社会稳定风险
    definition: 征收拆迁、居民诉求、舆情等社会稳定风险。
    direction: smaller_better
    directionNote: 稳定风险越低得分越高。
    source: 专家判断
    templateCell: B63
    anchors:
      - score: 1
        desc: 矛盾突出，稳定风险高
      - score: 3
        desc: 存在较明显诉求分歧
      - score: 5
        desc: 风险一般，可沟通化解
      - score: 7
        desc: 风险较低
      - score: 9
        desc: 无明显稳定风险
  - id: risk.delay
    criterionId: risk
    name: 工程延误风险
    definition: 审批、征拆、施工条件、管线迁改等导致工期延误的风险。
    direction: smaller_better
    directionNote: 延误风险越低得分越高。
    source: 现状分析
    templateCell: B64
    anchors:
      - score: 1
        desc: 关键条件不具备，延误风险高
      - score: 3
        desc: 前置条件较多
      - score: 5
        desc: 一般，可控
      - score: 7
        desc: 条件较好
      - score: 9
        desc: 条件成熟，几乎无延误风险

extension:
  maxIndicators: 20
  note: 新增项必须给 id/criterionId/name/definition/direction/source/anchors（+ 量化分档 metric/unit/formula/bands），并 version+1、跑 T4/T9/T10 回归。
  note2: templateCell 可省略（扩项无模板坐标）；新增/调项必须同步改 方向适配.yaml（DIR-1 会挂）；单准则指标数不得超过 10（受 validation.orderRange 与 RI 表上限约束）。

defaultRequired: true
requiredOverrideNote: 指标体系默认全部必选；方向适配 applicability 可覆盖为 optional / not_applicable（生效值以方向适配为准）。
quantificationFile: 指标量化分档.yaml
anchorsPolicy:
  scale: 10
  levels:
    - 1
    - 3
    - 5
    - 7
    - 9
  interpolation:
    numeric: 阶跃赋分（落档取分，档内不插值）：输入落入哪一档即取该档 score；端点同值归入「区间数值更高」的一档（见 标度与口径.yaml 的 bandTieBreak 取 higher_band_wins；例：current.age 的 60 归 1 分档）。
    condition: 只做离散：允许 1/3/5/7/9 五档；确需 1 位小数时必须在 basis.note 写依据并标 manualInterp=true，不静默插值。
    missingBand: 无分档覆盖的输入 → 拒绝打分（AHP-E-SCORE-BAND），不自动外推。
    decimal: score 默认 1/3/5/7/9 整数；manualInterp=true 时才允许 0-10 的 1 位小数。
  anchorsVsBands: anchors 是语义描述（给专家看、进报告）；quantification.bands 是数值边界（给引擎算、可复核）。两者必须同向：score 越大越好端。
  note: 通用草案（G-ahp-4 pendingConfirm）——改锚点/分档 = 升版本 + 跑回归。
